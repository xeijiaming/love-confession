<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 美味菜谱 - 家常菜大全</title>
<style>
:root {
  --primary: #e8533f;
  --primary-light: #fef0ef;
  --bg: #fdf6f0;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #6b7280;
  --border: #f0e6dc;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-hover: 0 12px 32px rgba(0,0,0,0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #e8533f 0%, #d4442a 40%, #c0392b 100%);
  color: #fff;
  padding: 32px 24px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 2px;
  position: relative;
  z-index: 1;
}
.header p {
  margin-top: 8px;
  font-size: 1rem;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

/* ── Stats bar ── */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 20px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-size: 1.6rem;
  font-weight: 700;
}
.stat-label {
  font-size: 0.8rem;
  opacity: 0.8;
}

/* ── Container ── */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ── Search & Filter ── */
.search-section {
  margin-top: -28px;
  position: relative;
  z-index: 10;
}
.search-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-hover);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-input-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: #9ca3af;
}
.search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 2px solid var(--border);
  border-radius: 50px;
  font-size: 0.95rem;
  outline: none;
  transition: var(--transition);
  background: #faf8f6;
}
.search-input:focus {
  border-color: var(--primary);
  background: #fff;
}

/* ── Category Tags ── */
.categories {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 24px 0 8px;
}
.cat-tag {
  padding: 8px 18px;
  border-radius: 50px;
  border: 2px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
  user-select: none;
}
.cat-tag:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.cat-tag.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ── Recipe Grid ── */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  padding: 12px 0 40px;
}

/* ── Recipe Card ── */
.recipe-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.recipe-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.card-img {
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  position: relative;
}
.card-img.cat-肉类  { background: linear-gradient(135deg, #fef3f2, #fde8e6); }
.card-img.cat-禽类  { background: linear-gradient(135deg, #fff8f0, #fef0e0); }
.card-img.cat-海鲜  { background: linear-gradient(135deg, #f0f7ff, #e0effe); }
.card-img.cat-素菜  { background: linear-gradient(135deg, #f2fdf2, #e0f8e0); }
.card-img.cat-汤羹  { background: linear-gradient(135deg, #fefce8, #fef9c3); }
.card-img.cat-豆腐  { background: linear-gradient(135deg, #fdf2f8, #fce7f3); }

.card-difficulty {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 600;
  backdrop-filter: blur(8px);
}
.diff-简单 { background: #d1fae5; color: #065f46; }
.diff-中等 { background: #fef3c7; color: #92400e; }
.diff-稍难 { background: #fee2e2; color: #991b1b; }

.card-body {
  padding: 18px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 14px;
  flex: 1;
}
.card-meta {
  display: flex;
  gap: 16px;
  font-size: 0.78rem;
  color: var(--text-light);
  flex-wrap: wrap;
}
.card-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background: #fff;
  border-radius: var(--radius);
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  transform: translateY(20px) scale(0.96);
  transition: var(--transition);
}
.modal-overlay.show .modal {
  transform: translateY(0) scale(1);
}
.modal-header {
  padding: 0;
  position: relative;
}
.modal-img-placeholder {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
}
.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.4);
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  z-index: 2;
}
.modal-close:hover { background: rgba(0,0,0,0.6); }
.modal-body { padding: 24px; }
.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 20px;
}

/* Section */
.section-title {
  font-size: 1rem;
  font-weight: 700;
  margin: 20px 0 10px;
  padding-left: 12px;
  border-left: 4px solid var(--primary);
}
.ingredient-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 6px;
  list-style: none;
  padding: 0;
}
.ingredient-list li {
  padding: 8px 12px;
  background: #faf8f6;
  border-radius: 8px;
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ingredient-list li::before {
  content: '•';
  color: var(--primary);
  font-weight: bold;
}
.step-list {
  padding: 0;
  list-style: none;
  counter-reset: step;
}
.step-list li {
  counter-increment: step;
  padding: 12px 16px 12px 52px;
  position: relative;
  margin-bottom: 8px;
  background: #faf8f6;
  border-radius: 10px;
  font-size: 0.9rem;
  line-height: 1.6;
}
.step-list li::before {
  content: counter(step);
  position: absolute;
  left: 12px;
  top: 12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Video Embed ── */
.video-section {
  margin: 20px 0;
}
.video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #000;
}
.video-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}

/* ── No Results ── */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.no-results .icon { font-size: 3rem; margin-bottom: 12px; }

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-light);
  font-size: 0.82rem;
  border-top: 1px solid var(--border);
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .header h1 { font-size: 1.6rem; }
  .recipe-grid { grid-template-columns: 1fr; }
  .search-card { flex-direction: column; }
  .stats-bar { gap: 16px; }
  .ingredient-list { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- ═══════ Header ═══════ -->
<header class="header">
  <h1>🍳 美味家常菜谱</h1>
  <p>从厨房小白到大厨，只差一份好菜谱</p>
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="totalCount">10</div><div class="stat-label">精选菜谱</div></div>

    <div class="stat-item"><div class="stat-num">🏠</div><div class="stat-label">家的味道</div></div>

<div class="container">

  <!-- ═══════ Search ═══════ -->
  <div class="search-section">

  <!-- ═══════ Recipe Grid ═══════ -->
  <div class="recipe-grid" id="recipeGrid"></div>

  <!-- ═══════ No Results ═══════ -->

</div>

<!-- ═══════ Footer ═══════ -->
<div class="footer">

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

  {

    emoji: '🐔',
    videoUrl: 'BV1fM4y1h7UP',

      '鸡胸肉 300g', '花生米 50g', '干辣椒 8个', '花椒 1小勺',

      '淀粉 2勺', '生抽 2勺', '香醋 2勺', '白糖 1.5勺',

      '锅留底油，小火煸香花椒和干辣椒，加姜蒜葱爆香。',
      '倒入鸡丁大火翻炒，淋入碗汁快速翻匀至汤汁浓稠。',
      '撒入花生米，淋少许香油，翻匀即可出锅。'
    ]
  },
  {
    id: 2,
    name: '红烧肉',
    emoji: '🥩',
    videoUrl: 'BV1wE411h7S2',
    category: '肉类',
    difficulty: '中等',
    time: '70分钟',
    calories: '520千卡',
    desc: '肥而不腻、入口即化的经典硬菜，色泽红亮，是家家户户的味觉记忆。',

  },
  {

// ═══════════════════════════════════════
//  State
// ═══════════════════════════════════════
let currentCategory = '全部';
let searchQuery = '';

// ═══════════════════════════════════════
//  Render
// ═══════════════════════════════════════
function getFilteredRecipes() {
  return recipes.filter(r => {
    const matchCat = currentCategory === '全部' || r.category === currentCategory;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || r.name.includes(q) || r.desc.includes(q) ||
      r.ingredients.some(i => i.includes(q)) || r.category.includes(q);
    return matchCat && matchSearch;
  });
}

function renderCards() {
  const filtered = getFilteredRecipes();
  const grid = document.getElementById('recipeGrid');
  const noResults = document.getElementById('noResults');
  const totalCount = document.getElementById('totalCount');

  totalCount.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="openDetail(${r.id})">
      <div class="card-img cat-${r.category}">
        <span>${r.emoji}</span>
        <span class="card-difficulty diff-${r.difficulty}">${r.difficulty}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${r.name}</div>
        <div class="card-desc">${r.desc}</div>
        <div class="card-meta">
          <span>🕐 ${r.time}</span>
          <span>🔥 ${r.calories}</span>
          <span>📂 ${r.category}</span>
        </div>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════
//  Modal
// ═══════════════════════════════════════
function openDetail(id) {
  const r = recipes.find(r => r.id === id);
  if (!r) return;

  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');

  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-img-placeholder cat-${r.category}" style="height:200px;display:flex;align-items:center;justify-content:center;font-size:5rem;">${r.emoji}</div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title">${r.name}</div>
      <div class="modal-subtitle">
        🕐 ${r.time} &nbsp;|&nbsp; 🔥 ${r.calories} &nbsp;|&nbsp; 📂 ${r.category} &nbsp;|&nbsp; ⭐ ${r.difficulty}
      </div>
      <p style="margin-bottom:6px;color:var(--text-light);font-size:0.9rem;">${r.desc}</p>

      ${r.videoUrl ? `
      <div class="section-title">🎬 制作视频</div>
      <div class="video-section">
        <div class="video-wrap">
          <iframe
            src="https://player.bilibili.com/player.html?bvid=${r.videoUrl}&page=1&high_quality=1&autoplay=0&as_wide=1"
            scrolling="no" border="0" frameborder="no" framespacing="0"
            allowfullscreen="true"
            sandbox="allow-scripts allow-same-origin allow-popups"
            referrerpolicy="no-referrer">
          </iframe>
        </div>
        <p style="margin-top:8px;font-size:0.82rem;color:#9ca3af;text-align:center;">
          💡 如视频无法加载，请
          <a href="https://www.bilibili.com/video/${r.videoUrl}/" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;">点击这里在B站观看</a>
          或使用本地服务器打开此页面
        </p>
      </div>
      ` : ''}

      <div class="section-title">📋 食材清单</div>
      <ul class="ingredient-list">
        ${r.ingredients.map(i => `<li>${i}</li>`).join('')}
      </ul>

      <div class="section-title">👨‍🍳 烹饪步骤</div>
      <ol class="step-list">
        ${r.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>
    </div>
  `;

  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════
//  Event Listeners
// ═══════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderCards();
});

document.getElementById('categoryTags').addEventListener('click', e => {
  if (!e.target.classList.contains('cat-tag')) return;
  document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentCategory = e.target.dataset.cat;
  renderCards();
});

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDetail();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

// ═══════════════════════════════════════
//  Init
// ═══════════════════════════════════════
renderCards();
</script>
