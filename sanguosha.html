<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ 三国杀 · 单机对决</title>
<style>
:root {
  --gold: #d4a856;
  --gold-light: #f0d68a;
  --red: #c0392b;
  --dark: #1a0a0a;
  --parchment: #f5f0e8;
  --card-bg: #fdf8f0;
  --hp: #2ecc71;
  --hp-dim: #7f8c8d;
  --text: #3d2b1a;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "STKaiti","KaiTi","楷体","PingFang SC","Microsoft YaHei",serif;
  background: radial-gradient(ellipse at center, #2c1810 0%, #1a0a0a 70%);
  min-height: 100vh;
  color: #e8d5b0;
  user-select: none;
  overflow-x: hidden;
}

/* ── Top Banner ── */
.banner {
  text-align: center;
  padding: 16px 20px 10px;
  background: linear-gradient(180deg, rgba(212,168,86,0.15) 0%, transparent 100%);
}
.banner h1 {
  font-size: 2.2rem;
  letter-spacing: 6px;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(212,168,86,0.4), 0 2px 4px rgba(0,0,0,0.5);
}
.banner .subtitle {
  font-size: 0.9rem;
  color: #b8956a;
  letter-spacing: 3px;
}

/* ── Main Layout ── */
.main-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: calc(100vh - 110px);
}

/* ── AI Area ── */
.ai-area {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  border: 1px solid rgba(212,168,86,0.2);
  min-height: 80px;
}
.ai-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.4rem;
  border: 3px solid var(--gold);
  flex-shrink: 0;
  background: linear-gradient(135deg, #3d1c1c, #1a0808);
}
.ai-info { flex:1; }
.ai-name { font-size: 1.2rem; font-weight: bold; color: var(--gold); }
.ai-hp-bar {
  display: flex; gap: 4px; margin-top: 4px;
}
.hp-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--hp);
  box-shadow: 0 0 6px rgba(46,204,113,0.5);
  transition: all 0.3s;
}
.hp-dot.lost { background: #444; box-shadow: none; }
.ai-cards {
  display: flex; gap: 4px; margin-left: auto;
}
.mini-card {
  width: 32px; height: 44px;
  background: linear-gradient(135deg, #c0392b, #8b1a1a);
  border-radius: 4px;
  border: 1px solid rgba(212,168,86,0.4);
}
.ai-hand-label {
  font-size: 0.8rem; color: #888; margin-left: 8px;
  white-space: nowrap;
}

/* ── Battle Log ── */
.battle-log {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px;
  background: rgba(0,0,0,0.25);
  border-radius: 10px;
  border: 1px solid rgba(212,168,86,0.12);
  font-size: 0.85rem;
  min-height: 60px;
  max-height: 150px;
}
.log-entry {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  animation: fadeIn 0.3s;
}
.log-entry.player { color: #5dade2; }
.log-entry.ai { color: #e74c3c; }
.log-entry.system { color: var(--gold); }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

/* ── Player Area ── */
.player-area {
  padding: 14px 20px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  border: 1px solid rgba(212,168,86,0.25);
}
.player-header {
  display: flex; align-items: center; gap: 12px;
}
.player-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  border: 3px solid #5dade2;
  background: linear-gradient(135deg, #1c2d3d, #08151a);
  flex-shrink: 0;
}
.player-name { font-size: 1.1rem; font-weight: bold; color: #5dade2; }
.player-hp-bar { display: flex; gap: 4px; margin-top: 2px; }
.skill-badge {
  font-size: 0.7rem; padding: 2px 10px; border-radius: 20px;
  background: rgba(212,168,86,0.2); color: var(--gold-light);
  border: 1px solid rgba(212,168,86,0.3);
  margin-left: auto;
}

/* ── Player Hand Cards ── */
.player-hand {
  display: flex; gap: 8px; padding: 12px 0 6px;
  flex-wrap: wrap; justify-content: center;
  min-height: 110px;
}

/* ── Card ── */
.card {
  width: 80px; height: 110px;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
  font-family: "STKaiti","KaiTi","楷体",serif;
}
.card:hover { transform: translateY(-12px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.card.selected { transform: translateY(-20px); box-shadow: 0 0 20px rgba(212,168,86,0.6); }
.card.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

.card-inner {
  width: 100%; height: 100%;
  border-radius: 8px;
  border: 2px solid #8b6914;
  background: linear-gradient(145deg, #fef3e0 0%, #f5e6cc 50%, #ead5b8 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6px;
  text-align: center;
  position: relative;
}
.card-icon { font-size: 1.6rem; margin-bottom: 2px; }
.card-name { font-size: 0.85rem; font-weight: bold; color: #3d1a1a; }
.card-type-label {
  font-size: 0.6rem; color: #8b6914; margin-top: 2px;
  padding: 1px 8px; border-radius: 10px;
  background: rgba(139,105,20,0.1);
}

/* Card color variants */
.card[data-color="red"] .card-inner { border-color: #c0392b; background: linear-gradient(145deg, #fff0f0 0%, #ffe0e0 50%, #fdd 100%); }
.card[data-color="blue"] .card-inner { border-color: #2980b9; background: linear-gradient(145deg, #f0f7ff 0%, #e0eeff 50%, #d0e4f8 100%); }
.card[data-color="gold"] .card-inner { border-color: #b8860b; background: linear-gradient(145deg, #fffdf0 0%, #fff8e0 50%, #fef3c8 100%); }

/* ── Action Buttons ── */
.action-bar {
  display: flex; gap: 10px; padding: 8px 0 4px;
  justify-content: center; flex-wrap: wrap;
}
.btn {
  padding: 10px 24px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: bold;
  font-family: inherit;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-attack {
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff; box-shadow: 0 4px 12px rgba(231,76,60,0.4);
}
.btn-heal {
  background: linear-gradient(135deg, #27ae60, #2ecc71);
  color: #fff; box-shadow: 0 4px 12px rgba(46,204,113,0.4);
}
.btn-strategy {
  background: linear-gradient(135deg, #8e44ad, #9b59b6);
  color: #fff; box-shadow: 0 4px 12px rgba(155,89,182,0.4);
}
.btn-end {
  background: linear-gradient(135deg, #555, #777);
  color: #fff;
}
.btn-ok {
  background: linear-gradient(135deg, #b8860b, #d4a856);
  color: #1a0a0a;
}
.btn-deny {
  background: linear-gradient(135deg, #444, #666);
  color: #fff;
}

/* ── Phase Indicator ── */
.phase-indicator {
  text-align: center;
  padding: 4px;
  font-size: 0.85rem;
  color: var(--gold-light);
  letter-spacing: 2px;
}

/* ── Modals ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: linear-gradient(135deg, #2c1810, #1a0a0a);
  border: 2px solid var(--gold);
  border-radius: 16px;
  padding: 24px;
  max-width: 500px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal h2 { color: var(--gold); text-align: center; font-size: 1.5rem; margin-bottom: 16px; }
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}
.char-card {
  padding: 14px 10px;
  border-radius: 10px;
  border: 2px solid rgba(212,168,86,0.3);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  background: rgba(0,0,0,0.3);
}
.char-card:hover { border-color: var(--gold); background: rgba(212,168,86,0.1); }
.char-card.selected { border-color: var(--gold); background: rgba(212,168,86,0.2); box-shadow: 0 0 16px rgba(212,168,86,0.3); }
.char-icon { font-size: 2.2rem; }
.char-name { font-size: 1rem; font-weight: bold; color: var(--gold-light); }
.char-title { font-size: 0.7rem; color: #b8956a; }
.char-skill-desc { font-size: 0.7rem; color: #998877; margin-top: 4px; }
.modal-btn {
  display: block; width: 100%; margin-top: 16px;
  padding: 12px; border-radius: 10px;
  border: none; cursor: pointer;
  font-size: 1.1rem; font-weight: bold;
  font-family: inherit; letter-spacing: 3px;
  background: linear-gradient(135deg, #b8860b, #d4a856);
  color: #1a0a0a;
}
.modal-btn:hover { transform: scale(1.02); }

/* ── Toast ── */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 30px;
  font-weight: bold; letter-spacing: 2px;
  z-index: 200; animation: toastIn 0.4s, toastOut 0.4s 1.5s forwards;
  pointer-events: none;
}
.toast.info { background: #2980b9; color: #fff; }
.toast.danger { background: #c0392b; color: #fff; }
.toast.success { background: #27ae60; color: #fff; }
.toast.gold { background: #d4a856; color: #1a0a0a; }
@keyframes toastIn { from { opacity:0; top:-40px; } to { opacity:1; top:20px; } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; top:-40px; } }

/* ── Game Over ── */
.victory-text { font-size: 2rem; text-align: center; margin: 12px 0; color: var(--gold); }
.defeat-text { font-size: 2rem; text-align: center; margin: 12px 0; color: #e74c3c; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .banner h1 { font-size: 1.5rem; }
  .card { width: 64px; height: 90px; }
  .card-icon { font-size: 1.2rem; }
  .card-name { font-size: 0.7rem; }
  .char-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="banner">
  <h1>⚔️ 三 国 杀</h1>
  <div class="subtitle">单机对决 · 1v1</div>
</div>

<div class="main-container" id="mainContainer">
  <!-- Dynamically filled -->
</div>

<!-- Character Select Modal -->
<div class="modal-overlay" id="charModal" style="display:none;">
  <div class="modal">
    <h2>🏯 选择你的武将</h2>
    <div class="char-grid" id="charGrid"></div>
    <button class="modal-btn" id="charConfirm" disabled>确认选择</button>
  </div>
</div>

<!-- Prompt Modal (for skill activation) -->
<div class="modal-overlay" id="promptModal" style="display:none;">
  <div class="modal" style="text-align:center;">
    <p id="promptMsg" style="font-size:1.1rem;margin-bottom:16px;"></p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-ok" id="promptYes">是</button>
      <button class="btn btn-deny" id="promptNo">否</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  Game Data
// ═══════════════════════════════════════

const CHARACTERS = [
  { id:'caocao', name:'曹操', title:'魏武帝', icon:'👑', skillName:'护驾', skillDesc:'受到伤害时，摸1张牌',
    onDamaged: (g, who) => { g.drawCards(who, 1); g.log(`👑 ${who.name}发动【护驾】，摸1张牌`); } },
  { id:'liubei', name:'刘备', title:'仁德之主', icon:'🫅', skillName:'仁德', skillDesc:'弃2张牌可回复1点体力',
    skillActive: (g) => {
      if (g.currentPlayer.hand.length >= 2) {
        return new Promise(resolve => {
          g.prompt(`是否发动【仁德】？弃2张牌回复1点体力 (当前手牌:${g.currentPlayer.hand.length})`, yes => {
            if (yes) {
              g.discardFromHand(g.currentPlayer, 2);
              g.heal(g.currentPlayer, 1);
              g.log('🫅 刘备发动【仁德】，弃2张牌回复1点体力');
            }
            resolve();
          });
        });
      }
      return Promise.resolve();
    } },
  { id:'guanyu', name:'关羽', title:'武圣', icon:'🗡️', skillName:'武圣', skillDesc:'可将【闪】当【杀】使用',
    // Passive: red cards / 闪 can be used as 杀 - handled in card selection logic
  },
  { id:'zhangfei', name:'张飞', title:'万夫莫开', icon:'🛡️', skillName:'咆哮', skillDesc:'出牌阶段可使用任意张【杀】',
    // Passive: no limit on 杀 per turn - handled in play logic
  },
  { id:'zhugeliang', name:'诸葛亮', title:'卧龙', icon:'🎯', skillName:'观星', skillDesc:'回合开始时查看牌堆顶3张牌，可任意调整顺序',
    skillActive: (g) => {
      return new Promise(resolve => {
        let top3 = g.deck.splice(0, 3);
        g.log('🎯 诸葛亮发动【观星】，查看牌堆顶3张牌');
        // Show a simple prompt - for simplicity, just put them back in desired order
        // In full version, user would reorder; here we let them keep and optionally discard
        g.showToast('观星：牌堆顶3张已查看','info');
        // Put back: keep good cards on top
        g.deck.unshift(...top3);
        resolve();
      });
    } },
  { id:'zhaoyun', name:'赵云', title:'常山子龙', icon:'🐉', skillName:'龙胆', skillDesc:'【杀】可当【闪】，【闪】可当【杀】',
    // Passive: 杀/闪 interchangeable
  },
];

const AI_NAMES = ['吕布', '袁绍', '董卓', '司马懿', '周瑜', '夏侯惇'];

// ═══════════════════════════════════════
//  Card Definitions
// ═══════════════════════════════════════
const CARD_DEFS = {
  'sha':     { name:'杀', icon:'⚔️', type:'basic', desc:'对目标造成1点伤害', color:'red' },
  'shan':    { name:'闪', icon:'🛡️', type:'basic', desc:'抵消【杀】的效果', color:'red' },
  'tao':     { name:'桃', icon:'🍑', type:'basic', desc:'回复1点体力', color:'red' },
  'juedou':  { name:'决斗', icon:'🤼', type:'strategy', desc:'双方交替出【杀】，先不出者受1点伤害', color:'blue' },
  'wuzhong': { name:'无中生有', icon:'✨', type:'strategy', desc:'摸2张牌', color:'gold' },
  'guohe':   { name:'过河拆桥', icon:'🌉', type:'strategy', desc:'弃置目标1张手牌', color:'blue' },
  'shunqian':{ name:'顺手牵羊', icon:'🐏', type:'strategy', desc:'获得目标1张手牌', color:'blue' },
};

// ═══════════════════════════════════════
//  Game State
// ═══════════════════════════════════════
class Game {
  constructor() {
    this.player = null;      // { name, character, hp, maxHp, hand[], alive }
    this.ai = null;
    this.deck = [];
    this.discardPile = [];
    this.currentTurn = 'player';
    this.turnPhase = 'draw';  // draw | play | discard
    this.turnNumber = 0;
    this.shaUsedThisTurn = 0;
    this.selectedCardIdx = -1;
    this.promptResolve = null;
    this.messages = [];
    this.isAnimating = false;
  }

  init(playerCharId) {
    this.messages = [];
    let charData = CHARACTERS.find(c => c.id === playerCharId);
    this.player = {
      name: '你',
      character: charData,
      hp: 4, maxHp: 4,
      hand: [],
      alive: true,
    };
    let aiChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
    let aiName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
    this.ai = {
      name: aiName,
      character: aiChar,
      hp: 4, maxHp: 4,
      hand: [],
      alive: true,
    };
    this.buildDeck();
    this.shuffleDeck();
    // Initial draw
    this.player.hand = this.deck.splice(0, 4);
    this.ai.hand = this.deck.splice(0, 4);
    this.turnNumber = 1;
    this.shaUsedThisTurn = 0;
    this.currentTurn = 'player';
    this.turnPhase = 'draw';
    this.log('⚔️ 战斗开始！');
    this.log(`你选择了 ${charData.icon} ${charData.name}(${charData.skillName})`);
    this.log(`对手是 ${aiChar.icon} ${aiName}·${aiChar.name}(${aiChar.skillName})`);
    // Player's turn: draw phase
    this.startTurn('player');
  }

  buildDeck() {
    this.deck = [];
    const addCards = (id, count) => { for (let i=0; i<count; i++) this.deck.push(id); };
    addCards('sha', 8);
    addCards('shan', 4);
    addCards('tao', 2);
    addCards('juedou', 2);
    addCards('wuzhong', 2);
    addCards('guohe', 2);
    addCards('shunqian', 2);
    this.discardPile = [];
  }

  shuffleDeck() {
    for (let i = this.deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
    }
  }

  ensureDeck() {
    if (this.deck.length === 0) {
      if (this.discardPile.length === 0) return; // truly empty
      this.deck = [...this.discardPile];
      this.discardPile = [];
      this.shuffleDeck();
      this.log('🔄 牌堆已空，弃牌堆重新洗入牌堆');
    }
  }

  drawCards(who, count) {
    let drawn = 0;
    for (let i = 0; i < count; i++) {
      this.ensureDeck();
      if (this.deck.length === 0) break;
      who.hand.push(this.deck.pop());
      drawn++;
    }
    if (drawn > 0 && who === this.player) {
      this.log(`你摸了 ${drawn} 张牌`);
    }
    return drawn;
  }

  dealDamage(source, target, amount) {
    if (!target.alive) return;
    target.hp -= amount;
    this.log(`${target.name} 受到 ${amount} 点伤害！`);
    if (target.hp <= 0) {
      target.hp = 0;
      target.alive = false;
      this.log(`💀 ${target.name} 阵亡！`);
      this.checkGameOver();
    }
    // Trigger on-damaged skill
    if (target.character.onDamaged && target.alive) {
      target.character.onDamaged(this, target);
    }
  }

  heal(who, amount) {
    who.hp = Math.min(who.maxHp, who.hp + amount);
    this.log(`${who.name} 回复 ${amount} 点体力`);
  }

  discardFromHand(who, count) {
    let discarded = [];
    for (let i = 0; i < count && who.hand.length > 0; i++) {
      let idx = who === this.ai ? this.aiChooseDiscard(who) : 0;
      let card = who.hand.splice(idx, 1)[0];
      this.discardPile.push(card);
      discarded.push(card);
    }
    return discarded;
  }

  aiChooseDiscard(who) {
    // Discard worst cards first: prioritize keeping 闪 and 桃
    let idx = 0;
    for (let i = 0; i < who.hand.length; i++) {
      let def = CARD_DEFS[who.hand[i]];
      // Keep 闪 and 桃
      if (def.name !== '闪' && def.name !== '桃') return i;
    }
    return 0;
  }

  // ── Turn Management ──
  startTurn(who) {
    this.currentTurn = who === this.player ? 'player' : 'ai';
    this.turnPhase = 'draw';
    this.shaUsedThisTurn = 0;
    let person = this.currentTurn === 'player' ? this.player : this.ai;
    let label = person.name;
    this.log(`━━━ ${label} 的回合 ━━━`, 'system');

    // Draw 2 cards
    this.drawCards(person, 2);

    // Skill trigger: 诸葛亮 观星
    if (person.character.skillActive && person.character.id === 'zhugeliang') {
      person.character.skillActive(this).then(() => {
        this.enterPlayPhase();
      });
    } else {
      this.enterPlayPhase();
    }
  }

  enterPlayPhase() {
    this.turnPhase = 'play';
    if (this.currentTurn === 'ai') {
      setTimeout(() => this.aiPlay(), 800);
    } else {
      this.render();
    }
  }

  endTurn() {
    let person = this.currentTurn === 'player' ? this.player : this.ai;
    // Discard to hand limit (no limit for simplicity, or 2x maxHP)
    let limit = person.maxHp;
    // Actually in simplified version, no discard limit for fun
    this.turnPhase = 'end';
    this.shaUsedThisTurn = 0;
    this.selectedCardIdx = -1;

    if (this.currentTurn === 'player') {
      this.currentTurn = 'ai';
      this.render();
      setTimeout(() => this.startTurn(this.ai), 500);
    } else {
      this.currentTurn = 'player';
      this.turnNumber++;
      this.render();
      this.startTurn(this.player);
    }
  }

  // ── AI Logic ──
  aiPlay() {
    if (!this.ai.alive || !this.player.alive) return;
    let ai = this.ai;

    // Use strategy cards
    let played = false;
    let hand = [...ai.hand];

    for (let i = 0; i < ai.hand.length; i++) {
      let cardId = ai.hand[i];
      let def = CARD_DEFS[cardId];
      if (!def) continue;

      if (cardId === 'tao' && ai.hp < ai.maxHp) {
        ai.hand.splice(i, 1);
        this.discardPile.push(cardId);
        this.heal(ai, 1);
        this.log(`🤖 ${ai.name} 使用【桃】回复体力`);
        played = true;
        this.render();
        setTimeout(() => this.aiPlay(), 600);
        return;
      }
      if (cardId === 'wuzhong') {
        ai.hand.splice(i, 1);
        this.discardPile.push(cardId);
        this.drawCards(ai, 2);
        this.log(`🤖 ${ai.name} 使用【无中生有】`);
        played = true;
        this.render();
        setTimeout(() => this.aiPlay(), 600);
        return;
      }
      if (cardId === 'guohe' && this.player.hand.length > 0) {
        ai.hand.splice(i, 1);
        this.discardPile.push(cardId);
        let stolen = this.player.hand.splice(Math.floor(Math.random() * this.player.hand.length), 1)[0];
        this.discardPile.push(stolen);
        this.log(`🤖 ${ai.name} 使用【过河拆桥】，弃掉你1张手牌`);
        played = true;
        this.render();
        setTimeout(() => this.aiPlay(), 600);
        return;
      }
      if (cardId === 'shunqian' && this.player.hand.length > 0) {
        ai.hand.splice(i, 1);
        this.discardPile.push(cardId);
        let stolen = this.player.hand.splice(Math.floor(Math.random() * this.player.hand.length), 1)[0];
        ai.hand.push(stolen);
        this.log(`🤖 ${ai.name} 使用【顺手牵羊】，拿走你1张手牌`);
        played = true;
        this.render();
        setTimeout(() => this.aiPlay(), 600);
        return;
      }
      if (cardId === 'juedou') {
        ai.hand.splice(i, 1);
        this.discardPile.push(cardId);
        this.log(`🤖 ${ai.name} 对你发起【决斗】！`);
        this.aiJuedou();
        played = true;
        this.render();
        setTimeout(() => this.aiPlay(), 600);
        return;
      }
    }

    // Play 杀
    if (this.shaUsedThisTurn < 1 || (ai.character.id === 'zhangfei')) {
      for (let i = 0; i < ai.hand.length; i++) {
        let cardId = ai.hand[i];
        let isSha = cardId === 'sha';
        // 关羽: 闪可当杀
        if (ai.character.id === 'guanyu' && cardId === 'shan') isSha = true;
        // 赵云: 杀闪互换
        if (ai.character.id === 'zhaoyun' && cardId === 'shan') isSha = true;

        if (isSha) {
          ai.hand.splice(i, 1);
          this.discardPile.push(cardId);
          this.shaUsedThisTurn++;
          this.log(`🤖 ${ai.name} 对你使用【杀】！`);
          this.resolveSha(ai, this.player);
          this.render();
          setTimeout(() => this.aiPlay(), 800);
          return;
        }
      }
    }

    // Nothing to do
    this.log(`🤖 ${ai.name} 无牌可出，结束回合`);
    this.endTurn();
  }

  aiJuedou() {
    // AI vs Player duel - player responds first
    this.log('决斗开始！你需要出【杀】来回应');
    this.prompt('决斗！要出【杀】吗？', yes => {
      if (yes) {
        // Player plays 杀
        let shaIdx = this.player.hand.findIndex(c => c === 'sha');
        // 赵云 can use 闪 as 杀
        if (shaIdx < 0 && this.player.character.id === 'zhaoyun') shaIdx = this.player.hand.findIndex(c => c === 'shan');
        // 关羽 can use 闪 as 杀
        if (shaIdx < 0 && this.player.character.id === 'guanyu') shaIdx = this.player.hand.findIndex(c => c === 'shan');

        if (shaIdx >= 0) {
          let card = this.player.hand.splice(shaIdx, 1)[0];
          this.discardPile.push(card);
          this.log('你打出【杀】回应决斗');
          // Now AI must respond
          let aiSha = this.ai.hand.findIndex(c => c === 'sha');
          if (aiSha < 0 && this.ai.character.id === 'zhaoyun') aiSha = this.ai.hand.findIndex(c => c === 'shan');
          if (aiSha < 0 && this.ai.character.id === 'guanyu') aiSha = this.ai.hand.findIndex(c => c === 'shan');
          if (aiSha >= 0) {
            let c = this.ai.hand.splice(aiSha, 1)[0];
            this.discardPile.push(c);
            this.log(`🤖 ${this.ai.name} 也打出【杀】`);
            this.render();
            // Player must respond again
            this.prompt('继续出【杀】？', yes2 => {
              if (yes2) {
                let idx2 = this.player.hand.findIndex(c => c === 'sha');
                if (idx2 < 0 && this.player.character.id === 'zhaoyun') idx2 = this.player.hand.findIndex(c => c === 'shan');
                if (idx2 < 0 && this.player.character.id === 'guanyu') idx2 = this.player.hand.findIndex(c => c === 'shan');
                if (idx2 >= 0) {
                  let c2 = this.player.hand.splice(idx2, 1)[0];
                  this.discardPile.push(c2);
                  this.log('你再次打出【杀】！');
                  this.dealDamage(this.player, this.ai, 1);
                  this.log(`🤖 ${this.ai.name} 无法回应，受到1点伤害`);
                } else {
                  this.dealDamage(this.ai, this.player, 1);
                  this.log('你无法出【杀】，受到1点伤害');
                }
              } else {
                this.dealDamage(this.ai, this.player, 1);
                this.log('你放弃出【杀】，受到1点伤害');
              }
              this.render();
            });
          } else {
            this.dealDamage(this.player, this.ai, 1);
            this.log(`🤖 ${this.ai.name} 无法回应，受到1点伤害`);
            this.render();
          }
        } else {
          this.dealDamage(this.ai, this.player, 1);
          this.log('你无法出【杀】，受到1点伤害');
          this.render();
        }
      } else {
        this.dealDamage(this.ai, this.player, 1);
        this.log('你放弃出【杀】，受到1点伤害');
        this.render();
      }
    });
  }

  // ── Resolve 杀 ──
  resolveSha(source, target) {
    if (target === this.player) {
      // Player needs to respond with 闪
      this.prompt(`${source.name} 对你使用了【杀】！要出【闪】吗？`, yes => {
        if (yes) {
          let shanIdx = target.hand.findIndex(c => c === 'shan');
          // 赵云 can use 杀 as 闪
          if (shanIdx < 0 && target.character.id === 'zhaoyun') shanIdx = target.hand.findIndex(c => c === 'sha');
          if (shanIdx >= 0) {
            let card = target.hand.splice(shanIdx, 1)[0];
            this.discardPile.push(card);
            this.log('你使用【闪】抵消了伤害');
          } else {
            this.dealDamage(source, target, 1);
          }
        } else {
          this.dealDamage(source, target, 1);
        }
        this.render();
      });
    } else {
      // AI responds
      let shanIdx = target.hand.findIndex(c => c === 'shan');
      if (shanIdx < 0 && target.character.id === 'zhaoyun') shanIdx = target.hand.findIndex(c => c === 'sha');
      if (shanIdx >= 0) {
        let card = target.hand.splice(shanIdx, 1)[0];
        this.discardPile.push(card);
        this.log(`🤖 ${target.name} 使用【闪】抵消了伤害`);
      } else {
        this.dealDamage(source, target, 1);
      }
    }
  }

  // ── Player plays a card ──
  playerPlayCard(cardIdx) {
    if (this.currentTurn !== 'player' || this.turnPhase !== 'play') return false;
    if (this.isAnimating) return false;

    let cardId = this.player.hand[cardIdx];
    if (!cardId) return false;
    let def = CARD_DEFS[cardId];

    // 关羽/赵云: 闪可当杀使用
    let effectiveCardId = cardId;
    if (cardId === 'shan' && this.canUseAsSha(cardId)) {
      // Player is using 闪 as 杀
      effectiveCardId = 'sha';
    }

    switch (effectiveCardId) {
      case 'sha':
        if (this.shaUsedThisTurn >= 1 && this.player.character.id !== 'zhangfei') {
          this.showToast('本回合已使用过【杀】','danger');
          return false;
        }
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        this.shaUsedThisTurn++;
        this.log('你使用了【杀】！');
        this.resolveSha(this.player, this.ai);
        this.render();
        return true;

      case 'tao':
        if (this.player.hp >= this.player.maxHp) {
          this.showToast('体力已满，不能使用【桃】','danger');
          return false;
        }
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        this.heal(this.player, 1);
        this.log('你使用【桃】回复1点体力');
        this.render();
        return true;

      case 'wuzhong':
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        this.drawCards(this.player, 2);
        this.log('你使用【无中生有】，摸2张牌');
        this.render();
        return true;

      case 'juedou':
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        this.log('你对对手发起【决斗】！');
        this.playerJuedou();
        this.render();
        return true;

      case 'guohe':
        if (this.ai.hand.length === 0) {
          this.showToast('对手没有手牌','danger');
          return false;
        }
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        let gDiscard = this.ai.hand.splice(Math.floor(Math.random() * this.ai.hand.length), 1)[0];
        this.discardPile.push(gDiscard);
        this.log('你使用【过河拆桥】，弃掉对手1张手牌');
        this.render();
        return true;

      case 'shunqian':
        if (this.ai.hand.length === 0) {
          this.showToast('对手没有手牌','danger');
          return false;
        }
        this.player.hand.splice(cardIdx, 1);
        this.discardPile.push(cardId);
        let stolen = this.ai.hand.splice(Math.floor(Math.random() * this.ai.hand.length), 1)[0];
        this.player.hand.push(stolen);
        this.log('你使用【顺手牵羊】，获得对手1张手牌');
        this.render();
        return true;

      default:
        return false;
    }
  }

  playerJuedou() {
    // Player initiated duel against AI
    // AI responds first
    let aiSha = this.ai.hand.findIndex(c => c === 'sha');
    if (aiSha < 0 && this.ai.character.id === 'zhaoyun') aiSha = this.ai.hand.findIndex(c => c === 'shan');
    if (aiSha < 0 && this.ai.character.id === 'guanyu') aiSha = this.ai.hand.findIndex(c => c === 'shan');
    if (aiSha >= 0) {
      let c = this.ai.hand.splice(aiSha, 1)[0];
      this.discardPile.push(c);
      this.log(`🤖 ${this.ai.name} 打出【杀】回应`);
      // Player must respond
      this.prompt('对手出了【杀】！你要出【杀】回应吗？', yes => {
        if (yes) {
          let pSha = this.player.hand.findIndex(c => c === 'sha');
          if (pSha < 0 && this.player.character.id === 'zhaoyun') pSha = this.player.hand.findIndex(c => c === 'shan');
          if (pSha < 0 && this.player.character.id === 'guanyu') pSha = this.player.hand.findIndex(c => c === 'shan');
          if (pSha >= 0) {
            let pc = this.player.hand.splice(pSha, 1)[0];
            this.discardPile.push(pc);
            this.log('你打出【杀】！');
            this.dealDamage(this.player, this.ai, 1);
            this.log(`🤖 ${this.ai.name} 无法继续回应，受到1点伤害`);
          } else {
            this.dealDamage(this.ai, this.player, 1);
            this.log('你无法出【杀】，受到1点伤害');
          }
        } else {
          this.dealDamage(this.ai, this.player, 1);
          this.log('你放弃出【杀】，受到1点伤害');
        }
        this.render();
      });
    } else {
      this.dealDamage(this.player, this.ai, 1);
      this.log(`🤖 ${this.ai.name} 无法出【杀】，受到1点伤害`);
    }
  }

  // ── Use 闪 as 杀 for 关羽/赵云 ──
  canUseAsSha(cardId) {
    if (cardId === 'sha') return true;
    if (this.player.character.id === 'guanyu' && cardId === 'shan') return true;
    if (this.player.character.id === 'zhaoyun' && cardId === 'shan') return true;
    return false;
  }

  // ── Check Game Over ──
  checkGameOver() {
    if (!this.player.alive) {
      this.showGameOver(false);
    } else if (!this.ai.alive) {
      this.showGameOver(true);
    }
  }

  showGameOver(playerWin) {
    this.isAnimating = true;
    let overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="text-align:center;">
        <div style="font-size:3rem;">${playerWin ? '🏆' : '💀'}</div>
        <div class="${playerWin ? 'victory-text' : 'defeat-text'}">${playerWin ? '大获全胜！' : '败北...'}</div>
        <p style="color:#b8956a;">${playerWin ? '你击败了对手，威震天下！' : '胜败乃兵家常事，再来一局吧！'}</p>
        <button class="modal-btn" onclick="location.reload()">🔄 再来一局</button>
      </div>`;
    document.body.appendChild(overlay);
  }

  // ── Prompt system ──
  prompt(msg, callback) {
    this.isAnimating = true;
    let modal = document.getElementById('promptModal');
    let msgEl = document.getElementById('promptMsg');
    let yesBtn = document.getElementById('promptYes');
    let noBtn = document.getElementById('promptNo');

    msgEl.textContent = msg;
    modal.style.display = 'flex';

    let handler = (answer) => {
      modal.style.display = 'none';
      yesBtn.removeEventListener('click', yesHandler);
      noBtn.removeEventListener('click', noHandler);
      this.isAnimating = false;
      callback(answer);
    };
    let yesHandler = () => handler(true);
    let noHandler = () => handler(false);
    yesBtn.addEventListener('click', yesHandler);
    noBtn.addEventListener('click', noHandler);
  }

  // ── Logging ──
  log(msg, type='system') {
    this.messages.push({msg, type});
    let logEl = document.getElementById('battleLog');
    if (logEl) {
      let entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = msg;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  // ── Toast ──
  showToast(msg, type='info') {
    let toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // ── Render ──
  render() {
    let container = document.getElementById('mainContainer');
    if (!container) return;

    let ai = this.ai;
    let player = this.player;

    // Check if card can be used as 杀
    let canSha = (cardId) => this.canUseAsSha(cardId);

    container.innerHTML = `
      <!-- AI Area -->
      <div class="ai-area">
        <div class="ai-avatar">${ai.alive ? ai.character.icon : '💀'}</div>
        <div class="ai-info">
          <div class="ai-name">${ai.character.icon} ${ai.name}·${ai.character.name}
            <span style="font-size:0.7rem;color:var(--gold-light);margin-left:6px;">[${ai.character.skillName}]</span>
          </div>
          <div class="ai-hp-bar">
            ${Array.from({length: ai.maxHp}, (_,i) =>
              `<div class="hp-dot ${i >= ai.hp ? 'lost' : ''}"></div>`
            ).join('')}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${Array.from({length: Math.min(ai.hand.length, 8)}, () =>
            '<div class="mini-card"></div>'
          ).join('')}
          <span class="ai-hand-label">${ai.hand.length}张手牌</span>
        </div>
      </div>

      <!-- Battle Log -->
      <div class="battle-log" id="battleLog">
        ${this.messages.map(m => `<div class="log-entry ${m.type}">${m.msg}</div>`).join('') || '<div class="log-entry system">📜 战斗记录</div>'}
      </div>

      <!-- Player Area -->
      <div class="player-area">
        <div class="player-header">
          <div class="player-avatar">${player.alive ? player.character.icon : '💀'}</div>
          <div>
            <div class="player-name">${player.character.icon} ${player.name}·${player.character.name}</div>
            <div class="player-hp-bar">
              ${Array.from({length: player.maxHp}, (_,i) =>
                `<div class="hp-dot ${i >= player.hp ? 'lost' : ''}"></div>`
              ).join('')}
            </div>
          </div>
          <div class="skill-badge">🎯 ${player.character.skillName}</div>
        </div>

        <!-- Player Hand -->
        <div class="player-hand" id="playerHand">
          ${player.hand.map((cardId, idx) => {
            let def = CARD_DEFS[cardId];
            let color = def.color;
            let isSelected = this.selectedCardIdx === idx;
            let isShaCard = canSha(cardId);
            let canPlay = this.currentTurn === 'player' && this.turnPhase === 'play';
            // Show "可当杀" for 关羽/赵云
            let extraLabel = '';
            if (cardId === 'shan' && isShaCard && cardId !== 'sha') {
              extraLabel = '可为杀';
            }
            let cls = isSelected ? 'selected' : '';
            if (!canPlay) cls += ' disabled';
            return `
              <div class="card ${cls}" data-color="${color}" onclick="game.cardClick(${idx})">
                <div class="card-inner">
                  <div class="card-icon">${def.icon}</div>
                  <div class="card-name">${def.name}</div>
                  <div class="card-type-label">${def.type}${extraLabel ? ' · ' + extraLabel : ''}</div>
                </div>
              </div>`;
          }).join('')}
          ${player.hand.length === 0 ? '<div style="color:#666;padding:20px;">暂无手牌</div>' : ''}
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
          ${this.currentTurn === 'player' && this.turnPhase === 'play' ? `
            <button class="btn btn-attack" onclick="game.playerPlayCard(game.selectedCardIdx)">⚔️ 出牌</button>
            <button class="btn btn-end" onclick="game.endTurn()">🏁 结束回合</button>
          ` : ''}
          ${this.currentTurn === 'ai' ? `
            <span style="color:#b8956a;">🤖 对手思考中...</span>
          ` : ''}
        </div>

        <div class="phase-indicator">
          ${this.currentTurn === 'player' && this.turnPhase === 'play' ?
            `⚡ 出牌阶段 · 第${this.turnNumber}回合 · 已用【杀】:${this.shaUsedThisTurn}/1` +
            (player.character.id === 'zhangfei' ? '(无限制)' : '')
            : ''}
          ${this.currentTurn === 'player' && this.turnPhase === 'draw' ? '📥 摸牌阶段...' : ''}
          ${this.currentTurn === 'ai' ? `🤖 对手回合 · 第${this.turnNumber}回合` : ''}
        </div>
      </div>
    `;

    // Repopulate battle log
    this.rebuildLog();
  }

  rebuildLog() {
    // Log is managed by the log() method appending to the DOM
  }

  cardClick(idx) {
    if (this.currentTurn !== 'player' || this.turnPhase !== 'play') return;
    this.selectedCardIdx = this.selectedCardIdx === idx ? -1 : idx;
    this.render();
  }
}

// ═══════════════════════════════════════
//  Init
// ═══════════════════════════════════════
let game;
let selectedCharId = null;

function showCharSelect() {
  let modal = document.getElementById('charModal');
  let grid = document.getElementById('charGrid');
  let confirmBtn = document.getElementById('charConfirm');

  grid.innerHTML = CHARACTERS.map(c => `
    <div class="char-card" data-id="${c.id}" onclick="selectChar('${c.id}')">
      <div class="char-icon">${c.icon}</div>
      <div class="char-name">${c.name}</div>
      <div class="char-title">${c.title}</div>
      <div class="char-skill-desc">【${c.skillName}】${c.skillDesc}</div>
    </div>
  `).join('');

  modal.style.display = 'flex';
  confirmBtn.disabled = true;
}

function selectChar(id) {
  selectedCharId = id;
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.char-card[data-id="${id}"]`).classList.add('selected');
  document.getElementById('charConfirm').disabled = false;
}

document.getElementById('charConfirm').addEventListener('click', () => {
  if (!selectedCharId) return;
  document.getElementById('charModal').style.display = 'none';
  game = new Game();
  window.game = game;
  game.init(selectedCharId);
  game.render();

  // Replay log entries into the current DOM
  let logEl = document.getElementById('battleLog');
  if (logEl) {
    // The log entries were created in the old DOM; we need to replay them
    // For simplicity, we just note that the render happens fresh
  }
});

// Start
showCharSelect();
</script>
